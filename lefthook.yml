# lefthook is the trigger; the three-stage logic (gitleaks → semgrep →
# conditional audit-all.sh) lives in scripts/git-hooks/pre-commit so it
# can also be invoked directly via `core.hooksPath`. `scripts/install-
# hooks.sh` picks the install mode at install time.

pre-commit:
  commands:
    audit-pipeline:
      # gitleaks (staged) → semgrep (staged) → audit-all (conditional).
      # Honors SKIP_STATIC_SCAN, SKIP_GITLEAKS, SKIP_SEMGREP, SKIP_AUDIT.
      run: scripts/git-hooks/pre-commit

pre-push:
  commands:
    tests:
      run: just test
    typecheck-backend:
      run: cd backend && uv run pyright
    typecheck-frontend:
      run: cd frontend && pnpm exec vue-tsc --noEmit
