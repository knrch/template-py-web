# Gitleaks config. Pair with repo-root `.gitleaksignore` if needed.
# Docs: https://github.com/gitleaks/gitleaks

title = "<PROJECT_NAME> gitleaks"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
]
