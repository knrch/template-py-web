[project]
name = "<PROJECT_NAME>-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests (require docker-compose up)",
]

[tool.coverage.run]
source = ["src/app"]
omit = ["src/app/main.py", "src/app/config.py", "src/app/logging.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
