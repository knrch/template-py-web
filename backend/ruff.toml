line-length = 100
target-version = "py314"

[lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "N",           # naming
    "ASYNC",       # async issues
    "S",           # bandit
    "C4",          # comprehensions
    "DTZ",         # datetime timezone
    "T20",         # no print
    "PT",          # pytest style
    "RET",         # return
    "SIM",         # simplify
    "RUF",         # ruff-specific
]
ignore = [
    "E501",        # line length handled by formatter
    "S101",        # assert in tests is fine
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
