name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 03:00 UTC — fresh advisory check against pinned digests
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install deps
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
        run: uv run pytest

      - name: Audit deps
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 0

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Audit deps
        run: pnpm audit --prod || true

  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Install semgrep
        run: pipx install semgrep
      - name: Gitleaks (full tree)
        run: gitleaks dir --no-banner -c .gitleaks.toml .
      - name: Semgrep (p/typescript + p/python)
        run: semgrep scan --metrics=off --error --disable-version-check --config=p/typescript --config=p/python frontend/src backend/src

  supply-chain-audit:
    # Heavier job; runs on schedule + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: uv python install 3.14
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@latest
      - name: Install pip-audit
        run: pipx install pip-audit
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Run audit-all (image findings informational)
        run: scripts/audit-all.sh --with-images-informational
