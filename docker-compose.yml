# Local development stack. Not used for deployment.
# Digests must match Dockerfiles + scripts/audit-all.sh. Resolve at bootstrap:
#   docker pull postgres:16-alpine
#   docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine
#   docker pull caddy:2-alpine
#   docker inspect --format='{{index .RepoDigests 0}}' caddy:2-alpine
services:
  postgres:
    image: postgres:16-alpine@sha256:PIN_ME_AT_BOOTSTRAP
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      LOG_LEVEL: INFO
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

  # Optional Caddy proxy. Enable with: `docker compose --profile proxy up`.
  # Routes /api/* → backend, /* → frontend. Mirrors the production topology
  # if you put Caddy in front on Railway.
  proxy:
    profiles: ["proxy"]
    build:
      context: ./proxy
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
